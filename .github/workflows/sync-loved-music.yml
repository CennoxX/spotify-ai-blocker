name: Sync loved.music AI Artists

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Same group as the issue review: both write SpotifyAiArtists.csv, one at a time.
concurrency:
  group: review-ai-artist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Sync the list
        id: sync
        run: |
          deno run --allow-read --allow-write --allow-env --allow-net=raw.githubusercontent.com .github/scripts/sync-loved-music.js

      - name: Commit and push changes
        if: steps.sync.outputs.added
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add SpotifyAiArtists.csv
          git commit -m "Sync ${{ steps.sync.outputs.added }} AI artists from loved.music" || exit 0

          # Reconcile with any commits that landed on main since checkout,
          # relying on the built-in `merge=union` driver declared in
          # .gitattributes for SpotifyAiArtists.csv.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git merge --no-edit origin/main && break
            echo "Merge attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 1))
          done

          # Push with retry in case another run landed a commit in the meantime.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi
            echo "Push attempt $i failed, fetching and retrying..."
            git fetch origin main
            git merge --no-edit origin/main
            sleep $((RANDOM % 5 + 1))
          done
